<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonton Film - RYZAFILMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body id="watchBody">

  <!-- Navigation -->
  <nav class="navbar" id="watchNavbar">
    <div class="logo"><i class="fa-solid fa-gamepad"></i> RYZAFILMS</div>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a></li>
      <li>
        <button class="theme-toggle-btn" onclick="toggleCinemaMode()">
          <i class="fa-solid fa-film" id="cinemaIcon"></i> <span id="cinemaText">Mode Sinema</span>
        </button>
      </li>
    </ul>
  </nav>

  <section class="container" style="text-align: center;">
    <h2 class="section-title" id="playerTitle">Memuat Film...</h2>
    <p class="section-subtitle"><i class="fa-solid fa-compact-disc"></i> Kualitas: <span id="playerQuality" class="neon-text">4K UHD</span> | Audio: Dolby Atmos</p>

    <!-- Area Pemutar Video -->
    <div class="video-wrapper" id="videoWrapper" style="max-width: 900px; margin: 20px auto; background: #000; border: 2px solid var(--primary); border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); transition: 0.4s;">
      <div id="videoContainer" style="position: relative; padding-bottom: 56.25%; height: 0;">
        <!-- Element Video akan diisi secara otomatis oleh JavaScript -->
      </div>
    </div>
  </section>

  <script>
    // Ambil parameter nama film dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const movieName = urlParams.get('title') || 'Film Asli';
    document.getElementById('playerTitle').innerText = movieName;

    const videoContainer = document.getElementById('videoContainer');

    // DAFTAR TRAILER FILM YOUTUBE YANG AMAN DI-EMBED
    const moviesData = {
      "Danur: The Last Chapter": "https://www.youtube.com/embed/5PS_w8gVvvQ",
      "Seporsi Mie Ayam": "https://www.youtube.com/embed/5PS_w8gVvvQ",
      "Spider-Man: Brand New Day": "https://www.youtube.com/embed/JfVOs4VSpmA",
      "Bapak Paling Jujur": "https://www.youtube.com/embed/LKxD8HFbqEQ"
    };

    const videoUrl = moviesData[movieName] || "https://www.youtube.com/embed/JfVOs4VSpmA";

    // Tampilkan pemutar iframe YouTube
    videoContainer.innerHTML = `
      <iframe src="${videoUrl}?autoplay=1" 
              title="${movieName}" 
              style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
      </iframe>`;

    // Fitur Mode Sinema (Cinematic Focus Mode)
    function toggleCinemaMode() {
      const body = document.getElementById('watchBody');
      const navbar = document.getElementById('watchNavbar');
      const wrapper = document.getElementById('videoWrapper');
      const cinemaText = document.getElementById('cinemaText');
      
      body.classList.toggle('cinema-active');
      navbar.classList.toggle('cinema-hide');

      if (body.classList.contains('cinema-active')) {
        cinemaText.innerText = 'Matikan Sinema';
        wrapper.style.maxWidth = '1100px';
        wrapper.style.borderColor = '#ff0055';
        wrapper.style.boxShadow = '0 0 50px rgba(255, 0, 85, 0.5)';
      } else {
        cinemaText.innerText = 'Mode Sinema';
        wrapper.style.maxWidth = '900px';
        wrapper.style.borderColor = 'var(--primary)';
        wrapper.style.boxShadow = '0 0 25px rgba(0, 240, 255, 0.3)';
      }
    }
  </script>
</body>
</html>
